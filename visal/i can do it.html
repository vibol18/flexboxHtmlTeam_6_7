<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container{
        display: flex;
        flex-direction: column;
        gap: 10px;
           
        }
        .container .box1{
            display: flex;
            justify-content: center;
            align-items: center;
            border: 3px solid cyan;
            width: 300px;
        }
        .container .box2{
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;

        }
        .box2 .boxb{
            border: 2px solid cyan;
            width: 15%;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .box2 .boxc{
            border: 2px solid cyan;
            width: 60%;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;

        }
        .box2 .boxd{
            border: 2px solid cyan;
            width: 15%;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container .E{
            display: flex;
            justify-content: center;
            align-items: center;
            border: 3px solid cyan;
            width: 300px;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="box1">
            A
        </div>
        <div class="box2">
            <div class="boxb">B</div>
            <div class="boxc">C</div>
            <div class="boxd">D</div>

        </div>
        <div class="E">
            E
        </div>

    </div>
    
</body>
</html>
