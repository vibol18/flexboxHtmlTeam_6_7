<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .all {
            border: 1px solid black;
            width: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 10px;
            background-color: rgb(66, 73, 75);
            padding: 10px;
            border-radius: 15px;
        }
        .all .header {
            background-color: gray;
            color: white;
            width: 370px;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 15px;
        }
        .all .body {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        .body .nav{
            width: 100px;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: gray;
            color: white;
            border-radius: 15px;
        }
        .body .article{
            width: 150px;
            height: 200px;
            background-color: gray;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 15px;
        }
        .body .aside{
            width: 100px;
            height: 200px;
            background-color: gray;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 15px;
        }
        .all .footer {
            background-color: gray;
            color: white;
            width: 370px;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 15px;
        }
    </style>
</head>

<body>
    <div class="all">
        <div class="header">
            < header >
        </div>
        <div class="body">
            <div class="nav"> < nav > </div>
            <div class="article"> < article > </div>
            <div class="aside"> < aside > </div>
        </div>
        <div class="footer"> < footer > </div>
    </div>
</body>

</html>
